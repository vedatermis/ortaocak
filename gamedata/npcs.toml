# Town NPCs (M14 "Pazar"): the merchants of the three towns. Contract in docs/PROTOCOL_SHOP.md §1;
# loaded and strictly validated by shared/game/Npcs.h (client, server and tools read this file).
# vo_server refuses to start (exit 6) if a merchant stands somewhere unusable (§1.2: not walkable
# 1 m round, on a road, within gate radius + 2 m of a gate or 4 m of a race spawn / arrival marker).
#
# [[npc]]   id (1..999, stable: ENTITY_SPAWN template_id of entity type 4), name, title, greeting
#           (Turkish, ours), model (npcs/<model>.vmesh; keys agreed with the art pipeline), zone,
#           x / z (metres; y from the terrain), yaw (radians, forward = (sin yaw, cos yaw); every
#           merchant faces its town's race spawn), kind ("merchant"), stock (item ids of
#           gamedata/items.toml in display order, 1..24, each with a value: the price).
# Positions: chosen next to each town's race spawn, off the road layer, with a straight walkable
# line from the spawn marker (bots and new players walk straight there).

# ---- Zone 1: Ortaocak (Eşik), the neutral market village ----

