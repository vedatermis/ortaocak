# Town NPCs (M14 "Pazar"): the merchants of the three towns. Contract in docs/PROTOCOL_SHOP.md §1;
# loaded and strictly validated by shared/game/Npcs.h (client, server and tools read this file).
# vo_server refuses to start (exit 6) if a merchant stands somewhere unusable (§1.2: no room for a
# customer - no point 2.5 m round it walkable with 0.5 m all round -, on a road, within gate radius + 2 m
# of a gate or 4 m of a race spawn / arrival marker).
#
# [[npc]]   id (1..999, stable: ENTITY_SPAWN template_id of entity type 4), name, title, greeting
#           (Turkish, ours), model (npcs/<model>.vmesh; keys agreed with the art pipeline), zone,
#           x / z (metres; y from the terrain), yaw (radians, forward = (sin yaw, cos yaw); every
#           merchant faces the way its stall faces), kind ("merchant"), stock (item ids of
#           gamedata/items.toml in display order, 1..32 (24 before M16), each with a value: the price),
#           upgrades (optional, M16: true = a smith that upgrades items, docs/PROTOCOL_UPGRADE.md §1; M17:
#           only Demirci Ilgaz in Eşik - the shared village is the one place for tav work, the homeland
#           smiths sell the stones and send the player there).
#           M17 (docs/PROTOCOL_QUESTS.md §1): kind "quest" = a quest giver without a shop (no stock); any
#           NPC may give / take back quests (gamedata/quests.toml names it). tint = [r, g, b] (0..255,
#           multiplied into the model's colour) and scale (0.8..1.2) let an NPC borrow another's model;
#           two NPCs may share a model only if these differ. Quest NPCs stand free on open ground at the
#           plaza's edge, off the road layer (same startup rules as the merchants).
# Positions (fix1): each merchant stands behind its stall's counter / anvil - Ortaocak's market stalls, the
# homelands' potion stalls and smithies placed by tools/blender/gen_zones.py (SHOP_STALLS; docs/SHOP_ART.md
# §2) - at the prop's `stand` point (shop_props_meta.json; market_stall: (0, -0.3)), inside the stall's
# blocked footprint, facing the way the stall faces; customers talk across the counter. gen_zones.py prints
# the homeland spots (MERCHANT lines) and checks the customer room. Off the road layer, reachable on foot.

# ---- Zone 1: Ortaocak (Eşik), the neutral market village ----

[[npc]]
id = 1
name = "Sürmeli Bacı"
title = "Şerbetçi"
greeting = "Yolun açık olsun, Közaran. Şerbetim de çiyim de taze; Ortaocak'ta iki halka da aynı fiyat."
model = "npc_potion_esik"
zone = 1
x = 236.35
z = 249.16
yaw = 1.1345    # at the open (lantern) end of the west market stall (236.97, 247.12), just past its counter
                # under the lantern, facing the plaza as it does (fix1 round 2: behind the counter the goods
                # piled on it hid all but her head)
kind = "merchant"
stock = [16, 17, 18, 19, 28, 29]

[[npc]]
id = 2
name = "Demirci Ilgaz"
title = "Pazar Demircisi"
greeting = "Ortaocak'ta kılıç da satılır kalkan da, ama kan dökülmez. Ne lazımsa söyle."
model = "npc_smith_esik"
zone = 1
x = 271.83
z = 241.75
yaw = -0.8378   # behind the counter of the east market stall (271.61, 241.95), facing the plaza as it does
kind = "merchant"
stock = [1, 2, 3, 4, 5, 6, 12, 14,            # M15: the Eşik weapons (level 11) and Yeminli chests / legs (13)
         46, 47, 48, 49, 50, 51, 52, 53, 116, 117, 121, 122, 126, 127,
         166, 167, 168]                       # M16: the three upgrade stones (Ham / Saf / Usta Tav Taşı)
upgrades = true                               # M16: upgrades weapons and armour (docs/PROTOCOL_UPGRADE.md);
