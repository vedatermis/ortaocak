# Monsters, spawn points and safe zones (M9 "İlk Kan"). Single source for the server's AI and the
# client's display; contract in docs/PROTOCOL_COMBAT.md §1.3. Template ids are sent on the wire
# (ENTITY_SPAWN.template_id); never reuse or renumber one.
#
# Külden Doğanlar (docs/LORE.md): ash and ember risen around the köz kırıkları. All three kinds are
# humanoid and use the character skeleton (assets/monsters/<model>.vmesh, clips
# monsters/<model>/<clip>.vanim); `scale` is the drawn size.
#
# [[monster]]   id, name, model, scale, level (1..10), hp, attack, defense (damage formula as for
#               players, docs/PROTOCOL_COMBAT.md §1.1), attack_range (m), attack_interval_ms,
#               move_speed (chase/return, m/s; keep it below the 5.5 m/s player run speed so a
#               player can always get away), wander_speed (idle, m/s), aggro_radius (m),
#               leash_radius (m from the spawn point), xp, respawn_ms (from death, >= 3000),
#               elite (optional, presentation)
# [[safe_zone]] zone, x, z, radius: "Ortaocak's oath ground" - nobody can be attacked inside,
#               monsters never enter. No wander circle may reach into one.
# [[spawn]]     zone, monster, x, z, radius (wander), count (default 1). Every spawn circle must be
#               walkable on the zone's walk mask (tests/game/MonstersTests.cpp checks the shipped
#               zone 1).
#
# Zone 1 layout (village plaza ~256/256, race spawns ~23 m from it, house ring ~40-58 m): four
# loose packs of Kül Çömezi 53-67 m out (NW, W, S, SE; members 12-14 m apart so one can be pulled at
# a time), Cüruf Yürüyen in pairs 110-120 m out (W, SW, SE, below the village plateau), one Kor
# Bekçisi on the plateau's north-west edge. The north-east (the road down to ~334/338 that the
# world_tour flow walks) is left free.

