# Monsters, spawn points and safe zones (M9 "İlk Kan"). Single source for the server's AI and the
# client's display; contract in docs/PROTOCOL_COMBAT.md §1.3. Template ids are sent on the wire
# (ENTITY_SPAWN.template_id); never reuse or renumber one.
#
# Külden Doğanlar (docs/LORE.md): ash and ember risen around the köz kırıkları. All three kinds are
# humanoid and use the character skeleton (assets/monsters/<model>.vmesh, clips
# monsters/<model>/<clip>.vanim); `scale` is the drawn size.
#
# [[monster]]   id, name, model, scale, level (1..20), hp, attack, defense (damage formula as for
#               players, docs/PROTOCOL_COMBAT.md §1.1), attack_range (m), attack_interval_ms,
#               move_speed (chase/return, m/s; keep it below the 5.5 m/s player run speed so a
#               player can always get away), wander_speed (idle, m/s), aggro_radius (m),
#               leash_radius (m from the spawn point), xp, respawn_ms (from death, >= 3000),
#               elite (optional; M15: a boss - "Boss" on the target frame and the name label, alone in
#               its slot, respawn in tens of minutes)
# [[safe_zone]] zone, x, z, radius: "Ortaocak's oath ground" - nobody can be attacked inside,
#               monsters never enter. No wander circle may reach into one.
# [[spawn]]     zone, monster, x, z, radius (wander), count (default 1): a loose spawn (none shipped since
#               M15; the format stays for tests and tools).
# [[slot]]      M15 "Avlaklar" (docs/PROTOCOL_LEVELS.md §3): a hunting slot - key ([a-z0-9_], unique),
#               name (shown by the client), zone, x, z (centre), monsters (template ids of ONE kind: same
#               name and model; members take them in turn), count (1..12; an elite stands alone),
#               ring (m: radius of the members' home ring), centre (one member at the centre; default
#               when count >= 7), start_angle (deg, 0 = +z), wander (m round each home, default 1),
#               respawn_ms / leash (overrides of the templates'), or homes = [[dx, dz], ...] instead
#               of the ring. Area = farthest home + wander (at most 9 m). Checked at load: two slots'
#               areas at least the larger aggro radius + 4 m apart, area + aggro clear of the safe
#               zones; at server start: every home and its wander circle walkable, a straight walkable
#               line to the centre, reachable on foot from the zone's spawn / arrival marker, area +
#               aggro clear of the gates (radius + 12 m) and the spawn / arrival markers (8 m; a boss
#               its leash + 10 m).
#
# M15 layout: every monster of the world stands in a slot. Each zone reads outwards from its town:
# levels 1-2 first (their kinds notice a player at 4 m since M15, 6 m before, in rings of 7 m: one member can be
# pulled at a time), then 3-4, then the new levels (Tanyeri / Demirağız 5-7 and 8-10, Ortaocak 11-13,
# 14-16, 17-19), each kind in three or four neighbouring slots; the bosses alone at the edges. Slot
# members respawn at their own home after respawn_ms (12 s at levels 1-2, 18 s at 3-4, 20 s at 5-10,
# 25 s from 11) and walk back to it past their 20 m leash. The north-east road of Ortaocak (the
# world_tour flow walks it down to ~334/338) is still left free.

