# Item templates (M8 "Kuşan"). Single source for server rules and client display; contract in
# docs/PROTOCOL_ITEMS.md. Ids are stable forever (they are stored in the database and sent on the
# wire); never reuse or renumber one.
#
# kind:    "weapon" | "shield" | "material" (M10: stackable, no slot; docs/PROTOCOL_LOOT.md §7)
#          | "consumable" (M14: used from the bag / skill bar; docs/PROTOCOL_SHOP.md §2.3)
# slot:    "main_hand" | "off_hand" | "either_hand" (main or off) | "two_hand" (main, needs off empty)
# classes: who may equip it: "warrior", "rogue", "mage", "priest"
# model:   mesh id under assets (weapons/<model>.vmesh); icon: ui/items/<icon>.vtex
# grip:    how the client holds it: "sword" | "dagger" | "mace" | "staff" | "axe2h" | "shield"
# Materials have only id, name, description, kind, icon and the optional keys below; slot, classes,
# level, attack, defense, model and grip must be absent.
# Optional (M10): max_stack (1..999, default 1; weapons/shields must be 1), value (Akçe, default 0;
# M14: what a merchant asks for it, and it buys it back for half rounded down; 0 = cannot be sold;
# every shipped item has one), rarity ("common" default | "uncommon" | "rare"; name colour).
# Consumables (M14) have the keys of a material plus restore_hp / restore_mp (0..100000, at least one
# above 0; restored at once, one shared cooldown of 10 s) and an id <= 32767 (it must fit a bar slot).
# Optional (M11, docs/PROTOCOL_STATS.md §5, weapons and shields only): attribute bonuses while equipped
# strength, dexterity, vitality, intelligence, spirit (0..50) and requirements req_strength, ...,
# req_spirit (0..255, the base value: class start + spent points). Starter kit items have none.
# Optional (M16, docs/PROTOCOL_UPGRADE.md §2, materials only): upgrade_stone = 1 | 2 | 3 marks an upgrade
# stone (Ham / Saf / Usta Tav Taşı). Weapons, shields and armour can be upgraded +0..+10 at the smiths.

