# Skills, branches and skill-point rules (M12 "Yetenek Yolları"). Single source for the server's
# rules and the client's skill bar / skill window; contract in docs/PROTOCOL_SKILLS.md (v6). Skill
# ids travel on the wire (SKILL_REQ, SKILL_STATE, ...) and are stored in the database: never reuse
# or renumber one. `key` is the icon / effect art key (assets: ui/skills/<key>.png).
#
# [rules]   points_per_level (skill points per level above 1), tier_points (points spent in the
#           branch needed for tier 1, 2, 3; first 0, non-decreasing), rank_levels (M15: the character
#           level each rank 1..5 needs; first 1, non-decreasing; docs/PROTOCOL_LEVELS.md §2).
# [[branch]] class (1 Warrior, 2 Rogue, 3 Mage, 4 Priest), index (0, 1), name.
# [[skill]] id (1..63), key ([a-z0-9_]), name, description (Turkish, placeholders of
#           PROTOCOL_SKILLS.md §7.6), class, branch, tier (1..3), free (exactly one per class: branch
#           0, tier 1, the class's M9 skill), target ("enemy" | "friendly" | "self"),
#           area ("around_self" | "around_target", optional) with radius (m), max_targets (1..16)
#           and affects ("enemies" default | "allies"), range (m; not for "self"), mp, cooldown_ms
#           (<= 60000), cast_ms (optional), damage (attack multiplier per hit), hits (1..5),
#           crit_bonus (% points), heal (% of the target's max hp), leap (+ leap_stop m), projectile
#           (presentation).
# [[skill.effect]] kind (attack_up, defense_up, haste, dodge_up, max_hp_up, dot, hot, slow, stun,
#           root, shield, weaken, taunt), on ("target" default | "self"), duration_ms, value (unit by
#           kind, §1.5; not for stun/root/taunt), tick_ms (dot/hot, default 1000).
# Numbers may be one value (all ranks) or five (rank 1..5); three values (the M12 form) are still read,
# ranks 4 and 5 then continue the rank 2 -> 3 step. M15 wrote ranks 4 and 5 out here: that step
# continued, except the heals (Soluk Güneş, Halka Şifası, Yenileyen Işık, Dirençli Soluk), which grow
# by half a step. Balance: tests/game/SkillBalanceTests.cpp.

[rules]
points_per_level = 1
tier_points = [0, 2, 4]
rank_levels = [1, 1, 1, 11, 16]

[[branch]]
class = 1
index = 0
name = "Hücum"

[[branch]]
class = 1
index = 1
name = "Siper"

[[branch]]
class = 2
index = 0
name = "Pusu"

[[branch]]
class = 2
index = 1
name = "Zehir"

[[branch]]
class = 3
index = 0
name = "Köz"

[[branch]]
class = 3
index = 1
name = "Kırağı"

[[branch]]
class = 4
index = 0
name = "Şifa"

[[branch]]
class = 4
index = 1
name = "Yargı"

