# Quests (M17 "Görevler"): the first quest line in Eşik (Ortaocak, the shared village where every new
# character starts) and its second leg in the two homelands. Contract in docs/PROTOCOL_QUESTS.md;
# loaded and strictly validated by shared/game/Quests.h (client, server and tools read this file;
# vo_server refuses to start on a problem). Rewards and their totals: docs/DEVELOPMENT_PLAN.md §37.
#
# [rules]            max_active (1..25, default 10): quests a character may have accepted at once.
# [[quest]]          id (1..999, stable: stored in character_quests and sent on the wire), name, giver (NPC id
#                    of npcs.toml), turn_in (NPC id, default the giver; another NPC needs a talk objective
#                    for it), level (lowest level that may accept it, default 1), race ("aydor" / "kargan",
#                    default both), after (a quest earlier in this file that must be handed in first),
#                    repeatable + cooldown_s (60 s .. 7 days, from the hand-in), story (the giver's offer),
#                    progress_text (the turn-in NPC while it is not done, optional), done_text (at the
#                    hand-in).
# [[quest.objective]] 1..3: type "kill" (monsters = template ids, count 1..50), "boss" (monsters = elite
#                    templates, count 1..5), "collect" (item, count 1..50: counted in the bag, taken at the
#                    hand-in; collect items come from the normal loot of the named monsters - there are no
#                    quest-only drops), "talk" (npc = the turn_in NPC). label (optional): the shown name.
#                    Kill credit: the player who owns the loot (the experience winner, else the killing blow).
# [quest.reward]     xp, coins (Akçe), items = [[id, count], ...] (everyone), class_items = { warrior = id,
#                    rogue = id, mage = id, priest = id } (the piece that fits the player's class), choice =
#                    [id, ...] (2..4: the player picks one at the hand-in). A hand-in whose items do not fit
#                    the bag is refused (BagFull) and changes nothing.
#
# Ids: 1-11 Eşik (both races; 10 Aydor, 11 Kargan), 21-24 Tanyeri (Aydor), 31-34 Demirağız (Kargan),
# 41-43 repeatable. NPCs: 1 Sürmeli Bacı, 2 Demirci Ilgaz, 10 Bilge Oruç, 11 Avcı Selvi, 12 Karakol Başı
# Toygar (Eşik), 13 Sancaktar Ece (Tanyeri), 14 Közbaşı Barsan (Demirağız). Monsters: 1-2 Kül Çömezi, 3-4
# Cüruf Yürüyen, 5 Kor Bekçisi (boss), 14-16 Kavruk Tırpancı, 17-19 Harman Devi, 20-22 Buzul Körükçü,
# 23-25 Örs Kıran, 36 Anız Ağası, 37 Körük Hanı (bosses). Items: 9 Kül Tozu, 10 Cüruf Parçası, 20 Kavruk
# Başak, 22 Körük Derisi, 166 Ham Tav Taşı, 167 Saf Tav Taşı.

[rules]
max_active = 10

