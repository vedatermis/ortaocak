level = 1
story = "Demek yemin ettin. Aydor mührüyle mi, Kargan taşıyla mı, burada fark etmez: Ant Taşı ikisini de okur. Ama yemin ayakla tutulur, dille değil. Meydanın doğusunda Avcı Selvi durur; Kül Çukuru'nu benden iyi bilir. Ona git, seni ben gönderdim de."
progress_text = "Selvi'yi bulamadın mı? Meydanın doğu ucunda, Ant Taşı'na bakan kadın."
done_text = "Oruç Dede mi yolladı seni? İyi. Yeni yemin edenlerin gözü hep kuzeydedir, kırıklarda. Önce ayağının altındaki küle bak."

