# Loot tables (M10 "Ganimet"; M15 "Avlaklar"): what a monster leaves in its loot container when it dies.
# Contract in docs/PROTOCOL_LOOT.md §2; loaded by shared/game/Loot.h (strict, like items.toml / monsters.toml).
#
# [[table]]       monsters (template ids of gamedata/monsters.toml, each in at most one table),
#                 coins = [min, max] (optional, default [0, 0]; Akçe, uniform, always dropped)
# [[table.drop]]  item (gamedata/items.toml id), chance (0 < chance <= 1, independent per line),
#                 count = [min, max] (optional, default [1, 1]; 1 <= min <= max <= the item's max_stack)
# At most 80 drop lines per table (M18; 32 in M16, 24 in M15, 8 before), no item twice in one table; a roll keeps the first 8
# items that drop (a container's entries), in line order. A monster without a table drops nothing; a
# roll with 0 coins and no item creates no container.
# M14 "Pazar": the old tables end their first lines with sparse potions (items 16-19); M15 appended the
# armour lines after them, so the earlier lines roll exactly as before for the same random sequence.
# M15 drop weights per kill (docs/DEVELOPMENT_PLAN.md §35.4): common gear 0.4-0.5 % per piece, uncommon
# 0.3-0.4 %, rare 0.15-0.2 %, unique 4-6 % per boss kill; bosses also drop their tier's gear at 4-8 %.
# world.testing_force_unique_drop = 1 makes every boss roll hold one of its uniques (testing only).
# M18 "Kuşanma": the new weapons, the Ant tier, the accessories and the ten new uniques are appended
# to the end of the tables (tools/content/m18_items.py; at most 80 lines per table now). Boss uniques
# 3-4 % per line (6-8 per boss), so a kill holds at least one in ~20-25 %.
# M16 "Tav": every table ends with its upgrade stone lines (docs/DEVELOPMENT_PLAN.md §36): Ham Tav Taşı
# 1-3 % from levels 1-10, Saf Tav Taşı 0.8-2.5 % from levels 8-19, Usta Tav Taşı 0.3-1 % from levels 14-19;
# bosses 10-50 % of the stone of their tier.

