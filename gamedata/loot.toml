# Loot tables (M10 "Ganimet"): what a monster leaves in its loot container when it dies. Contract in
# docs/PROTOCOL_LOOT.md §2; loaded by shared/game/Loot.h (strict, like items.toml / monsters.toml).
#
# [[table]]       monsters (template ids of gamedata/monsters.toml, each in at most one table),
#                 coins = [min, max] (optional, default [0, 0]; Akçe, uniform, always dropped)
# [[table.drop]]  item (gamedata/items.toml id), chance (0 < chance <= 1, independent per line),
#                 count = [min, max] (optional, default [1, 1]; 1 <= min <= max <= the item's max_stack)
# At most 8 drop lines per table, no item twice in one table. A monster without a table drops
# nothing; a roll with 0 coins and no item creates no container.
# M14 "Pazar": every table ends with sparse potion lines (items 16-19, docs/PROTOCOL_SHOP.md §5);
# they come last so the earlier lines roll exactly as before for the same random sequence.

# Kül Çömezi (levels 1 and 2)
[[table]]
monsters = [1, 2]
coins = [3, 9]

[[table.drop]]
item = 9        # Kül Tozu
chance = 0.45
count = [1, 2]

[[table.drop]]
item = 12       # Çömez Bıçağı
chance = 0.04

[[table.drop]]
item = 13       # Kömürlü Kılıç
chance = 0.04

[[table.drop]]
item = 16       # Kızılca Şerbet
chance = 0.05

[[table.drop]]
item = 18       # Şafak Çiyi
chance = 0.03

# Cüruf Yürüyen (levels 3 and 4)
[[table]]
monsters = [3, 4]
coins = [12, 25]

[[table.drop]]
item = 10       # Cüruf Parçası
chance = 0.50
count = [1, 2]

[[table.drop]]
item = 14       # Cüruf Topuzu
chance = 0.05

[[table.drop]]
item = 17       # Közlü Şerbet
chance = 0.04

[[table.drop]]
item = 19       # Ayaz Özü
chance = 0.03

