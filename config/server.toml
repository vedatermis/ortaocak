# VedatOnline server configuration (committed defaults).
# Machine-specific values and secrets go in config/server.local.toml (git-ignored), which is
# deep-merged on top of this file. See config/server.local.toml.example.

[server]
name = "VedatOnline Dev"
maintenance = false     # true: every handshake is answered with HELLO_ACK result 3 (maintenance)

[net]
listen_address = "0.0.0.0"
listen_port = 15001
max_connections = 2000  # beyond this, HELLO_ACK result 2 (server full)
# The server's Ed25519 key pair lives in config/keys/ (git-ignored). Create it once with
#   vo_server --gen-keys
# and put the printed public key into config/client.toml (server_public_key).

[auth]
# Development only: an unknown username with a valid password creates the account on first login.
dev_auto_register = false

[world]
# See docs/SERVER_WORLD.md.
tick_rate = 20          # world simulation ticks per second
assets_dir = ""         # compiled assets (assetc output); "" = search assets/ upwards from cwd / exe dir.
                        # Zone 1 terrain: <assets_dir>/terrain/zone1/zone1.vterrain (relative = repo root)
save_interval_s = 60    # periodic position save while in the world (0 = only on leave/disconnect)
move_bank_seconds = 1.0 # cap of the carried-over movement allowance (lag bursts vs. banked teleports)
spawn_spread_m = 2.0    # players placed at a spawn point land up to this far from it
stats_interval_s = 60   # world statistics log line (tick times, moves, relays); 0 = off
max_catch_up_ticks = 5  # further behind than this: skip ticks (logged) instead of catching up

[log]
level = "info"          # trace | debug | info | warn | error | fatal | off
file = ""               # optional, e.g. "logs/server.log" (relative to the repo root)

[db]
# Never put the real connection string here. Set it in config/server.local.toml
# or in the VEDAT_DB_URL environment variable (env wins over both files).
connection_string = ""
# Empty = no database: the in-memory account service is used (data is lost on exit).
# Set: PostgreSQL account service; the database is created (via admin_connection_string, if set)
# and migrated at startup. See docs/DATABASE.md.
admin_connection_string = ""   # maintenance DB (e.g. .../postgres), only to CREATE DATABASE if missing; env VEDAT_DB_ADMIN_URL
schema = "public"              # all tables live in this schema (search_path)
pool_size = 4                  # pooled connections
worker_threads = 4             # DB worker threads (also run the Argon2id hashing)
statement_timeout_ms = 5000    # per statement; 0 = none (migrations always run without)
connect_timeout_s = 5
required = true                # true: refuse to start when the database is unreachable
