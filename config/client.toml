# VedatOnline client configuration. Local overrides: config/client.local.toml (git-ignored), deep-
# merged on top of this file. tools/dev/setup-dev.ps1 writes the dev server's key there.

# Pinned server Ed25519 public key (64 hex chars, printed by `vo_server --gen-keys`). The handshake
# is aborted ("sunucu doğrulanamadı") if the server's signature does not verify against it. Leave it
# empty here; put the real key into config/client.local.toml.
server_public_key = ""

[server]
host = "127.0.0.1"
port = 15001
connect_timeout_ms = 10000   # resolve + TCP connect + handshake
request_timeout_ms = 15000   # login / character / world requests; no answer -> disconnect

[window]
width = 1280
height = 720
vsync = true

[graphics]
# docs/CLIENT_RENDERING.md §7; `--graphics key=value` overrides any of these for one run.
shadows = true         # sun shadow map in the world (--no-shadows overrides; blob shadows stay)
msaa = 4               # multisampling of the HDR 3D world pass: 1 (off), 2, 4, 8 (--msaa overrides)
shadow_cascades = 2    # 1 (one 48 m cascade) or 2 (14 m + 64 m: nearby buildings and characters sharp)
shadow_filter = "pcf"  # "pcf" (16-tap soft edges) or "hard"
normal_maps = true     # tangent-space normal maps
specular = true        # GGX specular (sun + environment); false = diffuse only
rim_light = true       # character rim light in the world, fill + rim lights in the preview
exposure = 1.0         # multiplies the light rig's exposure
tonemap = "aces"       # "aces" (fitted filmic curve) or "clamp"
compressed_textures = true # load the pre-mipped BC .vtex textures; false decodes the PNGs

[log]
level = "info"          # trace | debug | info | warn | error | fatal | off
file = "vo_client.log"  # relative paths are resolved against the executable directory
